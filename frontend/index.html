<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT Clone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        body {
            background-color: #202123;
            color: #ececf1;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background-color: #202123;
            border-right: 1px solid #343541;
            display: flex;
            flex-direction: column;
            padding: 12px 0;
        }

        .new-chat-btn {
            margin: 0 12px 20px;
            padding: 10px 14px;
            background-color: #343541;
            border: 1px solid #565869;
            border-radius: 8px;
            color: #ececf1;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .new-chat-btn:hover {
            background-color: #40414f;
        }

        .sidebar-menu {
            flex: 1;
            padding: 0 12px;
            overflow-y: auto;
        }

        .menu-item {
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 14px;
            color: #b0b0bc;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu-item:hover {
            background-color: #343541;
        }

        .menu-item.active {
            background-color: #343541;
            color: #ececf1;
        }

        .sidebar-footer {
            padding: 12px;
            border-top: 1px solid #343541;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .user-avatar {
            width: 34px;
            height: 34px;
            background-color: #ff3b30;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 12px;
        }

        /* Main Area */
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 12px 20px;
            border-bottom: 1px solid #343541;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 18px;
            font-weight: 600;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .welcome-text {
            font-size: 32px;
            margin-bottom: 40px;
            color: #ececf1;
        }

        .input-container {
            width: 100%;
            max-width: 760px;
            position: relative;
            display: flex;
            align-items: center;
        }

        .upload-btn {
            position: absolute;
            left: 12px;
            z-index: 2;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 20px;
            color: #8e8ea0;
        }

        .upload-btn:hover {
            color: #ececf1;
        }

        .upload-btn input[type="file"] {
            display: none;
        }

        .input-box {
            flex: 1;
            padding: 16px 60px 16px 50px;
            background-color: #40414f;
            border: 1px solid #565869;
            border-radius: 12px;
            color: #ececf1;
            font-size: 16px;
            resize: none;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .input-box:focus {
            outline: none;
            border-color: #6e49cb;
            box-shadow: 0 0 0 3px rgba(110, 73, 203, 0.3);
        }

        .send-btn {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 20px;
            color: #8e8ea0;
        }

        .send-btn:hover {
            color: #ececf1;
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <button class="new-chat-btn">+ New chat</button>

        <div class="sidebar-menu">
            <div class="menu-item active">
                <span>📄</span> Introduction to AI
            </div>
            <div class="menu-item">
                <span>🔍</span> Web Search Tips
            </div>
            <div class="menu-item">
                <span>💻</span> Coding Help
            </div>
            <div class="menu-item">
                <span>🧮</span> Math Problems
            </div>
        </div>

        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar">RY</div>
                <div>
                    <div>rahul yadav</div>
                    <div style="font-size: 12px; color: #8e8ea0;">Free Plan</div>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Area -->
    <div class="main-area">
        <header>
            <div class="logo">ChatGPT</div>
            <!-- Removed Upgrade button -->
        </header>

        <div class="main-content">
            <div class="welcome-text">Good to see you, rahul yadav.</div>

            <div class="input-container">
                <label class="upload-btn" title="Upload document">
                    <input type="file" accept=".pdf,.txt,.docx,.csv,image/*">
                    📎
                </label>
                <textarea class="input-box" rows="1" placeholder="Ask anything"></textarea>
                <button class="send-btn">➤</button>
            </div>
        </div>
    </div>
</body>
</html>
